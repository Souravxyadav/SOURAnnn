<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scholarship Ledger - Welcome</title>
<meta name="description" content="Scholarship student management system. Please choose your portal.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="js/tailwind-init.js"></script>
<link rel="stylesheet" href="css/base.css">
</head>

<body class="bg-paper min-h-screen flex flex-col font-body text-ink-900">
  <header class="w-full bg-white border-b border-ink-100 py-4 px-4 sm:px-6 flex items-center justify-between shadow-xs">
    <div class="font-display text-lg sm:text-xl font-bold text-ink-900 flex items-center gap-2">
      <div class="w-7 h-7 sm:w-8 sm:h-8 rounded-lg seal shadow-xs"></div>
      Scholar<span class="text-gold-600">Ledger</span>
    </div>
    
  </header>
  <main class="flex-1 flex items-center justify-center p-4 py-8 sm:py-12">


  <div class="w-full max-w-md bg-white rounded-2xl border border-ink-100 shadow-card p-6 md:p-6 space-y-8">
    <div class="text-center space-y-2">
      <div class="w-16 h-16 bg-ink-900 rounded-2xl mx-auto flex items-center justify-center text-white mb-4">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/>
        </svg>
      </div>
      <h1 class="font-display text-2xl font-bold text-ink-900">Scholarship Ledger</h1>
      <p class="text-ink-500 text-sm">Please select your portal to continue.</p>
    </div>

    <div class="space-y-4">
      <a href="login.html" class="flex items-center p-4 bg-ink-50 rounded-xl hover:bg-ink-100 transition-colors border border-transparent hover:border-ink-200 group">
        <div class="w-10 h-10 bg-white rounded-lg flex items-center justify-center text-ink-900 shadow-sm mr-4">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        </div>
        <div class="flex-1">
          <h2 class="font-display font-semibold text-ink-900 text-sm">Admin Panel</h2>
          <p class="text-xs text-ink-500">Manage students and applications</p>
        </div>
        <svg class="text-ink-400 group-hover:text-ink-900 transition-colors" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
      </a>

      <a href="student-login.html" class="flex items-center p-4 bg-emerald-50 rounded-xl hover:bg-emerald-100 transition-colors border border-transparent hover:border-emerald-200 group">
        <div class="w-10 h-10 bg-white rounded-lg flex items-center justify-center text-emerald-600 shadow-sm mr-4">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
        </div>
        <div class="flex-1">
          <h2 class="font-display font-semibold text-emerald-900 text-sm">Student Panel</h2>
          <p class="text-xs text-emerald-700/70">Check application status</p>
        </div>
        <svg class="text-emerald-500 group-hover:text-emerald-700 transition-colors" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
      </a>

      <a href="student-register.html" class="flex items-center p-4 bg-blue-50 rounded-xl hover:bg-blue-100 transition-colors border border-transparent hover:border-blue-200 group">
        <div class="w-10 h-10 bg-white rounded-lg flex items-center justify-center text-blue-600 shadow-sm mr-4">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg>
        </div>
        <div class="flex-1">
          <h2 class="font-display font-semibold text-blue-900 text-sm">Student Registration</h2>
          <p class="text-xs text-blue-700/70">Create a new student profile</p>
        </div>
        <svg class="text-blue-500 group-hover:text-blue-700 transition-colors" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
      </a>
    </div>
  </div>


  </main>
  <footer class="w-full bg-white border-t border-ink-100 py-6 text-center text-xs text-ink-500">
    &copy; 2026 ScholarLedger. All rights reserved.
  </footer>
</body>

</html>
