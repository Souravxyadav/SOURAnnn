<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Portal Login · ScholarLedger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="js/tailwind-init.js"></script>
<link rel="stylesheet" href="css/base.css">
</head>
<body class="min-h-screen bg-paper flex items-center justify-center px-4 py-8 text-ink-900 font-body">

  <div class="w-full max-w-sm space-y-6">
    <div class="text-center">
      <div class="w-14 h-14 rounded-2xl seal mx-auto mb-3 shadow-md"></div>
      <h1 class="font-display text-2xl font-bold text-ink-900">Student <span class="text-gold-600">Portal</span></h1>
      <p class="text-xs text-ink-500 mt-1 font-medium">Track scholarship milestones, disbursements & application status</p>
    </div>

    <form id="student-login-form" onsubmit="handleStudentLogin(event)" class="bg-white rounded-3xl shadow-card border border-ink-100 p-6 sm:p-7 space-y-4">
      <div>
        <label class="block text-xs font-bold uppercase text-ink-700 mb-1.5">Registered Mobile Number *</label>
        <div class="relative">
          <span class="absolute left-3.5 top-2.5 text-xs text-ink-400 font-mono font-medium">+91</span>
          <input type="tel" id="login-mobile" required pattern="[0-9]{10}" maxlength="10"
            class="w-full rounded-xl border border-ink-200 pl-11 pr-3.5 py-2.5 text-xs font-mono font-medium text-ink-900 focus:border-gold-500 focus:ring-1 focus:ring-gold-500 outline-none transition"
            placeholder="9876543210">
        </div>
      </div>

      <div>
        <label class="block text-xs font-bold uppercase text-ink-700 mb-1.5">Date of Birth (DOB) *</label>
        <input type="date" id="login-dob" required
          class="w-full rounded-xl border border-ink-200 px-3.5 py-2.5 text-xs text-ink-900 focus:border-gold-500 focus:ring-1 focus:ring-gold-500 outline-none transition">
        <p class="text-[10px] text-ink-400 mt-1">Used to verify student identity securely.</p>
      </div>

      <p id="student-login-error" class="hidden text-xs text-red-600 bg-red-50 border border-red-200 rounded-xl p-3 leading-relaxed"></p>

      <button type="submit" id="student-login-btn"
        class="w-full bg-ink-900 hover:bg-ink-800 text-white font-bold text-xs rounded-xl py-3 transition shadow-xs">
        Access My Student Portal
      </button>

      <!-- Demo Student Quick Fill -->
      <button type="button" onclick="fillDemoStudent()" class="w-full border border-gold-300 bg-gold-50 hover:bg-gold-100 text-gold-900 text-xs font-semibold py-2 rounded-xl transition">
        ⚡ Demo Student Quick Sign In
      </button>

      <div class="pt-2 text-center border-t border-ink-100">
        <p class="text-xs text-ink-500">New student without an account?</p>
        <div class="flex items-center justify-center gap-3 mt-2 text-xs font-semibold">
          <a href="student-register.html" class="text-gold-600 hover:text-gold-700 hover:underline">Self Registration Form →</a>
          <span class="text-ink-300">·</span>
          <a href="login.html" class="text-ink-500 hover:text-ink-800 hover:underline">Admin Login</a>
        </div>
      </div>
    </form>

    <p class="text-center text-[11px] text-ink-400">ScholarLedger Student Self-Service Network</p>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/utils.js"></script>
<script src="js/toast.js"></script>
<script>
  async function fillDemoStudent() {
    try {
      const { data } = await window.supabaseClient.from("students").select("mobile, dob").limit(1);
      if (data && data.length > 0) {
        document.getElementById("login-mobile").value = data[0].mobile || "9876543210";
        document.getElementById("login-dob").value = data[0].dob || "2002-05-15";
      } else {
        document.getElementById("login-mobile").value = "9876543210";
        document.getElementById("login-dob").value = "2002-05-15";
      }
    } catch (e) {
      document.getElementById("login-mobile").value = "9876543210";
      document.getElementById("login-dob").value = "2002-05-15";
    }
  }

  async function handleStudentLogin(e) {
    e.preventDefault();
    const mobile = document.getElementById("login-mobile").value.trim();
    const dob = document.getElementById("login-dob").value;
    const errorBox = document.getElementById("student-login-error");
    const btn = document.getElementById("student-login-btn");

    errorBox.classList.add("hidden");
    btn.disabled = true;
    btn.textContent = "Verifying Credentials...";

    try {
      const sb = window.supabaseClient;
      // Search for student with matching mobile
      const { data, error } = await sb.from("students").select("*").eq("mobile", mobile);

      if (error) throw error;

      if (!data || data.length === 0) {
        throw new Error("No student registered with this mobile number. Please check or register a new profile.");
      }

      // Check DOB if provided on profile
      const student = data[0];
      if (student.dob && dob && student.dob !== dob) {
        throw new Error("Date of Birth does not match the registered record.");
      }

      // Save token to localStorage
      localStorage.setItem("student_session_token", student.id);
      window.location.href = "student-portal.html";
    } catch (err) {
      errorBox.textContent = err.message || "Unable to sign in. Please verify your details.";
      errorBox.classList.remove("hidden");
      btn.disabled = false;
      btn.textContent = "Access My Student Portal";
    }
  }
</script>
</body>
</html>
