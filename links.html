<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Official Portals & Important Links · ScholarLedger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="js/tailwind-init.js"></script>
<link rel="stylesheet" href="css/base.css">
<script src="js/admin-auth.js"></script>
</head>
<body class="bg-paper min-h-screen text-ink-900 font-body">

  <div class="flex min-h-screen w-full max-w-full">
    <aside id="sidebar"></aside>

    <div class="flex-1 min-w-0 w-full max-w-full min-h-screen pb-24 md:pb-8">
      <header id="topbar"></header>

      <main class="px-3.5 sm:px-6 md:px-8 py-6 max-w-7xl mx-auto space-y-6">

        <!-- Toolbar & Filter Bar -->
        <div class="bg-white p-4 rounded-2xl border border-ink-100 shadow-card flex flex-col md:flex-row md:items-center justify-between gap-3">
          <div class="flex flex-col sm:flex-row sm:items-center gap-3 flex-1">
            <div class="relative flex-1 max-w-md">
              <input id="linkSearchInput" oninput="filterLinksSearch()" type="search" placeholder="Search official portals, schemes, verification tools…"
                class="w-full rounded-xl border border-ink-200 bg-ink-50/50 pl-10 pr-4 py-2.5 text-xs md:text-sm outline-none focus:border-gold-500 focus:bg-white focus:ring-1 focus:ring-gold-500 transition">
              <svg class="w-4 h-4 text-ink-400 absolute left-3.5 top-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
            </div>

            <!-- Categories Tabs -->
            <div class="flex items-center gap-1.5 overflow-x-auto table-scroll max-w-full pb-1">
              <button onclick="filterLinksCategory('all', this)" class="category-filter-btn px-3 py-1.5 rounded-xl text-xs font-semibold bg-ink-900 text-white transition shrink-0">All</button>
              <button onclick="filterLinksCategory('Government', this)" class="category-filter-btn px-3 py-1.5 rounded-xl text-xs font-medium text-ink-600 hover:bg-ink-50 transition shrink-0">Govt Portals</button>
              <button onclick="filterLinksCategory('Verification', this)" class="category-filter-btn px-3 py-1.5 rounded-xl text-xs font-medium text-ink-600 hover:bg-ink-50 transition shrink-0">Verification</button>
              <button onclick="filterLinksCategory('Scholarship', this)" class="category-filter-btn px-3 py-1.5 rounded-xl text-xs font-medium text-ink-600 hover:bg-ink-50 transition shrink-0">Scholarships</button>
              <button onclick="filterLinksCategory('Tools', this)" class="category-filter-btn px-3 py-1.5 rounded-xl text-xs font-medium text-ink-600 hover:bg-ink-50 transition shrink-0">Tools & Utilities</button>
            </div>
          </div>

          <div class="flex items-center gap-2 justify-end">
            <button onclick="openAddLinkModal()" class="px-4 py-2.5 bg-ink-900 hover:bg-ink-800 text-white text-xs font-bold rounded-xl shadow-xs transition flex items-center gap-1.5 shrink-0">
              <span>+ Add Portal Link</span>
            </button>
          </div>
        </div>

        <!-- Loading State -->
        <div id="loadingState" class="hidden text-center py-12 text-ink-400 text-sm">
          Loading official portals and important links…
        </div>

        <!-- Empty State -->
        <div id="emptyState" class="hidden text-center py-16 bg-white rounded-2xl border border-dashed border-ink-200">
          <div class="w-12 h-12 rounded-2xl bg-gold-50 text-gold-600 flex items-center justify-center mx-auto text-xl mb-3">🔗</div>
          <p class="font-semibold text-sm text-ink-700">No portal links found.</p>
          <p class="text-xs text-ink-400 mt-1 mb-4">Add quick links for government scholarship portals, NPCI check, and university websites.</p>
          <button onclick="openAddLinkModal()" class="bg-ink-900 hover:bg-ink-800 text-white text-xs font-semibold rounded-xl px-4 py-2.5 shadow-xs transition">+ Add Important Link</button>
        </div>

        <!-- Links Grid -->
        <div id="linksGrid" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>

      </main>
    </div>
  </div>

  <nav id="bottom-nav"></nav>

  <!-- Add/Edit Link Modal -->
  <div id="linkModal" class="modal-root hidden fixed inset-0 z-50 flex items-end md:items-center justify-center p-0 md:p-4">
    <div onclick="closeLinkModal()" class="absolute inset-0 bg-ink-950/60 backdrop-blur-xs"></div>
    <div class="relative bg-white w-full md:max-w-lg md:rounded-3xl rounded-t-3xl max-h-[92vh] overflow-y-auto translate-y-full md:translate-y-0 md:opacity-0 md:scale-95 opacity-100 scale-100 shadow-2xl transition-all z-10">
      <div class="sticky top-0 bg-white/95 backdrop-blur-xs border-b border-ink-100 px-6 py-4.5 flex items-center justify-between z-10">
        <div>
          <h3 id="linkModalTitle" class="font-display text-base font-bold text-ink-900">Add Important Link</h3>
          <p class="text-xs text-ink-500 mt-0.5">Quick access reference for counselors and students.</p>
        </div>
        <button onclick="closeLinkModal()" class="w-8 h-8 rounded-full bg-ink-50 hover:bg-ink-100 text-ink-500 flex items-center justify-center text-sm transition">✕</button>
      </div>

      <form id="linkForm" onsubmit="handleSaveLink(event)" class="p-6 space-y-4">
        <input type="hidden" id="editLinkId">

        <div>
          <label class="block text-xs font-bold uppercase text-ink-700 mb-1.5">Portal / Resource Title *</label>
          <input required id="formLinkTitle" class="w-full rounded-xl border border-ink-200 px-3.5 py-2.5 text-xs outline-none focus:border-gold-500 focus:ring-1 focus:ring-gold-500" placeholder="e.g. National Scholarship Portal (NSP)">
        </div>

        <div>
          <label class="block text-xs font-bold uppercase text-ink-700 mb-1.5">URL / Web Address *</label>
          <input required type="url" id="formLinkUrl" class="w-full rounded-xl border border-ink-200 px-3.5 py-2.5 text-xs outline-none focus:border-gold-500 focus:ring-1 focus:ring-gold-500" placeholder="https://scholarships.gov.in">
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
          <div>
            <label class="block text-xs font-bold uppercase text-ink-700 mb-1.5">Category</label>
            <select id="formLinkCategory" class="w-full rounded-xl border border-ink-200 px-3 py-2.5 text-xs outline-none focus:border-gold-500 bg-white">
              <option value="Government">Government</option>
              <option value="Verification">Verification</option>
              <option value="Scholarship">Scholarship</option>
              <option value="Tools">Tools & Utilities</option>
              <option value="University">University</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-bold uppercase text-ink-700 mb-1.5">Display Order</label>
            <input type="number" id="formLinkOrder" value="0" class="w-full rounded-xl border border-ink-200 px-3 py-2.5 text-xs outline-none focus:border-gold-500">
          </div>
          <div>
            <label class="block text-xs font-bold uppercase text-ink-700 mb-1.5">Badge Text</label>
            <input id="formLinkBadge" class="w-full rounded-xl border border-ink-200 px-3 py-2.5 text-xs outline-none focus:border-gold-500" placeholder="e.g. Central / Live">
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold uppercase text-ink-700 mb-1.5">Description / Purpose</label>
          <textarea id="formLinkDescription" rows="2" class="w-full rounded-xl border border-ink-200 px-3.5 py-2.5 text-xs outline-none focus:border-gold-500 focus:ring-1 focus:ring-gold-500" placeholder="Short description of what counselors use this portal for…"></textarea>
        </div>

        <div class="flex items-center gap-2 pt-1">
          <input type="checkbox" id="formLinkActive" checked class="w-4 h-4 rounded text-gold-500 border-ink-300">
          <label for="formLinkActive" class="text-xs font-semibold text-ink-800 cursor-pointer">Visible in Quick Portals directory</label>
        </div>

        <div class="flex gap-3 pt-3 border-t border-ink-100">
          <button type="button" onclick="closeLinkModal()" class="flex-1 border border-ink-200 text-ink-700 text-xs font-semibold rounded-xl py-2.5 hover:bg-ink-50 transition">Cancel</button>
          <button type="submit" id="saveLinkBtn" class="flex-1 bg-ink-900 hover:bg-ink-800 text-white text-xs font-bold rounded-xl py-2.5 shadow-xs transition">Save Important Link</button>
        </div>
      </form>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/constants.js"></script>
<script src="js/utils.js"></script>
<script src="js/auth.js"></script>
<script src="js/layout.js"></script>
<script src="js/toast.js"></script>
<script src="js/modal.js"></script>
<script src="js/links.js"></script>
</body>
</html>
