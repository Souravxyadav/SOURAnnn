<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scholarships Catalog · ScholarLedger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="js/tailwind-init.js"></script>
<link rel="stylesheet" href="css/base.css">
<script src="js/admin-auth.js"></script>
</head>
<body class="bg-paper min-h-screen text-ink-900 font-body">

  <div class="flex min-h-screen w-full max-w-full">
    <aside id="sidebar"></aside>

    <div class="flex-1 min-w-0 w-full max-w-full min-h-screen pb-24 md:pb-8">
      <header id="topbar"></header>

      <main class="px-3.5 sm:px-6 md:px-8 py-6 max-w-7xl mx-auto space-y-6">

        <!-- Action & Filter Bar -->
        <div class="bg-white p-4 rounded-2xl border border-ink-100 shadow-card space-y-3">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
            <div class="relative flex-1 max-w-lg">
              <input id="search-input" type="search" placeholder="Search scholarship schemes, providers, categories, states, guidelines…"
                class="w-full h-10 rounded-xl border border-ink-200 bg-ink-50/50 pl-10 pr-4 text-xs md:text-sm outline-none focus:border-gold-500 focus:bg-white focus:ring-1 focus:ring-gold-500 transition">
              <svg class="w-4 h-4 text-ink-400 absolute left-3.5 top-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
            </div>

            <div class="flex items-center gap-3 justify-between sm:justify-end shrink-0">
              <p id="result-count" class="text-xs font-bold text-ink-500 font-mono"></p>
              <button onclick="openScholarshipForm()" class="h-10 px-4 bg-ink-900 hover:bg-ink-800 active:bg-ink-950 text-white text-xs font-bold rounded-xl shadow-xs transition flex items-center justify-center gap-1.5 shrink-0">
                <span>+ Add Scholarship</span>
              </button>
            </div>
          </div>

          <!-- Extended Filter Selectors: 2-column mobile grid, auto-wrap on desktop -->
          <div class="grid grid-cols-2 sm:grid-cols-4 lg:flex lg:flex-wrap lg:items-center gap-2 pt-2.5 border-t border-ink-100">
            <!-- Status Filter -->
            <select id="status-filter" class="w-full lg:w-auto h-9 rounded-xl border border-ink-200 bg-ink-50/60 px-2.5 text-xs text-ink-800 outline-none focus:border-gold-500 focus:bg-white transition truncate">
              <option value="ALL">All Statuses</option>
              <option value="ACTIVE">Active Only</option>
              <option value="INACTIVE">Archived Only</option>
            </select>

            <!-- Scheme Category Filter -->
            <select id="scheme-category-filter" class="w-full lg:w-auto h-9 rounded-xl border border-ink-200 bg-ink-50/60 px-2.5 text-xs text-ink-800 outline-none focus:border-gold-500 focus:bg-white transition truncate">
              <option value="ALL">All Categories</option>
              <option value="Central">Central Sector Schemes</option>
              <option value="State">State Domicile Schemes</option>
              <option value="Post Matric">Post-Matric</option>
              <option value="Pre Matric">Pre-Matric</option>
              <option value="Merit">Merit / Means</option>
              <option value="Minority">Minority Communities</option>
              <option value="Girls">Girls & Women</option>
              <option value="Disability">PwD Special</option>
            </select>

            <!-- State Eligibility Filter -->
            <select id="state-filter" class="w-full lg:w-auto h-9 rounded-xl border border-ink-200 bg-ink-50/60 px-2.5 text-xs text-ink-800 outline-none focus:border-gold-500 focus:bg-white transition truncate">
              <option value="ALL">All States / Pan-India</option>
            </select>

            <!-- Sort Option -->
            <select id="sort-filter" class="w-full lg:w-auto lg:ml-auto h-9 rounded-xl border border-ink-200 bg-ink-50/60 px-2.5 text-xs text-ink-800 outline-none focus:border-gold-500 focus:bg-white transition truncate">
              <option value="newest">Sort: Recently Added</option>
              <option value="amount-desc">Sort: Amount (High to Low)</option>
              <option value="name-asc">Sort: Scheme Name (A to Z)</option>
            </select>

            <!-- Reset Button -->
            <button onclick="resetScholarshipFilters()" class="col-span-2 sm:col-span-4 lg:col-span-auto h-9 px-3 rounded-xl border border-ink-200 bg-white hover:bg-ink-50 active:bg-ink-100 text-xs font-semibold text-ink-600 hover:text-ink-900 transition flex items-center justify-center cursor-pointer">
              Reset Filters
            </button>
          </div>
        </div>

        <!-- Scholarships Grid -->
        <div id="scholarships-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 w-full">
          <div class="col-span-full text-center py-12 text-ink-400">Loading scholarships catalog…</div>
        </div>

      </main>
    </div>
  </div>

  <nav id="bottom-nav"></nav>

  <!-- Add/Edit scholarship modal -->
  <div id="scholarship-modal" class="modal-root hidden fixed inset-0 z-50 flex items-end md:items-center justify-center p-0 md:p-4">
    <div data-modal-backdrop class="absolute inset-0 bg-ink-950/60 backdrop-blur-xs"></div>
    <div data-sheet class="relative bg-white w-full md:max-w-2xl md:rounded-3xl rounded-t-3xl max-h-[92vh] overflow-y-auto translate-y-full md:translate-y-0 md:opacity-0 md:scale-95 opacity-100 scale-100 shadow-2xl transition-all">
      <div class="sticky top-0 bg-white/95 backdrop-blur-xs border-b border-ink-100 px-6 py-4.5 flex items-center justify-between z-10">
        <div>
          <h3 id="scholarship-modal-title" class="font-display text-base font-bold text-ink-900">Add Scholarship Scheme</h3>
          <p class="text-xs text-ink-500 mt-0.5">Define scheme terms, sanction ceilings, and eligibility criteria.</p>
        </div>
        <button data-close-modal="scholarship-modal" class="w-8 h-8 rounded-full bg-ink-50 hover:bg-ink-100 text-ink-500 flex items-center justify-center text-sm transition">✕</button>
      </div>

      <form id="scholarship-form" class="p-6 space-y-4">
        <input type="hidden" id="s-id">

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold uppercase text-ink-700 mb-1.5">Scholarship Name *</label>
            <input required id="s-name" class="w-full rounded-xl border border-ink-200 px-3.5 py-2.5 text-xs outline-none focus:border-gold-500 focus:ring-1 focus:ring-gold-500" placeholder="e.g. Post-Matric PMS Portal">
          </div>
          <div>
            <label class="block text-xs font-bold uppercase text-ink-700 mb-1.5">Provider / Ministry *</label>
            <input required id="s-provider" class="w-full rounded-xl border border-ink-200 px-3.5 py-2.5 text-xs outline-none focus:border-gold-500 focus:ring-1 focus:ring-gold-500" placeholder="e.g. Govt of Bihar / AICTE">
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
          <div>
            <label class="block text-xs font-bold uppercase text-ink-700 mb-1.5">Sanction Amount (₹)</label>
            <input type="number" id="s-max-amount" class="w-full rounded-xl border border-ink-200 px-3.5 py-2.5 text-xs outline-none focus:border-gold-500 focus:ring-1 focus:ring-gold-500" placeholder="e.g. 50000">
          </div>
          <div>
            <label class="block text-xs font-bold uppercase text-ink-700 mb-1.5">Advisory Commission (%)</label>
            <input type="number" step="0.5" id="s-commission-pct" class="w-full rounded-xl border border-ink-200 px-3.5 py-2.5 text-xs outline-none focus:border-gold-500 focus:ring-1 focus:ring-gold-500" placeholder="10">
          </div>
          <div>
            <label class="block text-xs font-bold uppercase text-ink-700 mb-1.5">Target Category</label>
            <select id="s-category" class="w-full rounded-xl border border-ink-200 px-3 py-2.5 text-xs outline-none focus:border-gold-500 focus:ring-1 focus:ring-gold-500 bg-white">
              <option value="All">All Categories</option>
              <option value="General">General</option>
              <option value="OBC">OBC</option>
              <option value="SC">SC</option>
              <option value="ST">ST</option>
              <option value="Minority">Minority</option>
              <option value="EWS">EWS</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
          <div>
            <label class="block text-xs font-bold uppercase text-ink-700 mb-1.5">Max Annual Income (₹)</label>
            <input type="number" id="s-income-limit" class="w-full rounded-xl border border-ink-200 px-3.5 py-2.5 text-xs outline-none focus:border-gold-500 focus:ring-1 focus:ring-gold-500" placeholder="0 for no limit">
          </div>
          <div>
            <label class="block text-xs font-bold uppercase text-ink-700 mb-1.5">Min Academic Score (%)</label>
            <input type="number" step="0.5" id="s-min-pct" class="w-full rounded-xl border border-ink-200 px-3.5 py-2.5 text-xs outline-none focus:border-gold-500 focus:ring-1 focus:ring-gold-500" placeholder="0 for no limit">
          </div>
          <div>
            <label class="block text-xs font-bold uppercase text-ink-700 mb-1.5">Gender Eligibility</label>
            <select id="s-gender" class="w-full rounded-xl border border-ink-200 px-3 py-2.5 text-xs outline-none focus:border-gold-500 focus:ring-1 focus:ring-gold-500 bg-white">
              <option value="All">All Genders</option>
              <option value="Female">Female Only</option>
              <option value="Male">Male Only</option>
            </select>
          </div>
        </div>

        <!-- Enhanced Eligibility Rules -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
          <div>
            <label class="block text-xs font-bold uppercase text-ink-700 mb-1.5">Eligible State / Domicile</label>
            <select id="s-state" class="w-full rounded-xl border border-ink-200 px-3 py-2.5 text-xs outline-none focus:border-gold-500 focus:ring-1 focus:ring-gold-500 bg-white">
              <option value="All India">All India (Any State)</option>
              <option value="Bihar">Bihar</option>
              <option value="Uttar Pradesh">Uttar Pradesh</option>
              <option value="Rajasthan">Rajasthan</option>
              <option value="Madhya Pradesh">Madhya Pradesh</option>
              <option value="Delhi">Delhi</option>
              <option value="Maharashtra">Maharashtra</option>
              <option value="West Bengal">West Bengal</option>
              <option value="Jharkhand">Jharkhand</option>
              <option value="Karnataka">Karnataka</option>
              <option value="Tamil Nadu">Tamil Nadu</option>
              <option value="Gujarat">Gujarat</option>
              <option value="Punjab">Punjab</option>
              <option value="Haryana">Haryana</option>
              <option value="Other">Other State</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-bold uppercase text-ink-700 mb-1.5">Course Level Eligibility</label>
            <select id="s-course-level" class="w-full rounded-xl border border-ink-200 px-3 py-2.5 text-xs outline-none focus:border-gold-500 focus:ring-1 focus:ring-gold-500 bg-white">
              <option value="Any">Any Degree / Level</option>
              <option value="UG">UG (Undergraduate)</option>
              <option value="PG">PG (Postgraduate)</option>
              <option value="Diploma">Diploma / Polytechnic</option>
              <option value="School">School (Class 1-12)</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-bold uppercase text-ink-700 mb-1.5">PwD Requirement</label>
            <select id="s-pwd" class="w-full rounded-xl border border-ink-200 px-3 py-2.5 text-xs outline-none focus:border-gold-500 focus:ring-1 focus:ring-gold-500 bg-white">
              <option value="Any">Any (No PwD restriction)</option>
              <option value="Yes">PwD Only (Yes)</option>
              <option value="No">Non-PwD (No)</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
          <div>
            <label class="block text-xs font-bold uppercase text-ink-700 mb-1.5">Academic Session</label>
            <select id="s-year" class="w-full rounded-xl border border-ink-200 px-3 py-2.5 text-xs outline-none focus:border-gold-500 focus:ring-1 focus:ring-gold-500 bg-white">
              <option value="2026-2027">2026-2027</option>
              <option value="2025-2026">2025-2026</option>
              <option value="2024-2025">2024-2025</option>
              <option value="2023-2024">2023-2024</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-bold uppercase text-ink-700 mb-1.5">Application Start Date</label>
            <input type="date" id="s-start" class="w-full rounded-xl border border-ink-200 px-3.5 py-2.5 text-xs outline-none focus:border-gold-500 focus:ring-1 focus:ring-gold-500">
          </div>
          <div>
            <label class="block text-xs font-bold uppercase text-ink-700 mb-1.5">Application End Date</label>
            <input type="date" id="s-end" class="w-full rounded-xl border border-ink-200 px-3.5 py-2.5 text-xs outline-none focus:border-gold-500 focus:ring-1 focus:ring-gold-500">
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold uppercase text-ink-700 mb-1.5">Official Portal URL</label>
            <input type="url" id="s-official-url" class="w-full rounded-xl border border-ink-200 px-3.5 py-2.5 text-xs outline-none focus:border-gold-500 focus:ring-1 focus:ring-gold-500" placeholder="https://pmsonline.bih.nic.in">
          </div>
          <div>
            <label class="block text-xs font-bold uppercase text-ink-700 mb-1.5">Direct Application URL</label>
            <input type="url" id="s-application-url" class="w-full rounded-xl border border-ink-200 px-3.5 py-2.5 text-xs outline-none focus:border-gold-500 focus:ring-1 focus:ring-gold-500" placeholder="https://...">
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold uppercase text-ink-700 mb-1.5">Eligibility Summary & Guidelines</label>
          <textarea id="s-eligibility" rows="2" class="w-full rounded-xl border border-ink-200 px-3.5 py-2.5 text-xs outline-none focus:border-gold-500 focus:ring-1 focus:ring-gold-500" placeholder="Eligible degrees, domicile requirements, and essential documents…"></textarea>
        </div>

        <div>
          <label class="block text-xs font-bold uppercase text-ink-700 mb-1.5">Description</label>
          <textarea id="s-description" rows="2" class="w-full rounded-xl border border-ink-200 px-3.5 py-2.5 text-xs outline-none focus:border-gold-500 focus:ring-1 focus:ring-gold-500" placeholder="Brief scheme summary…"></textarea>
        </div>

        <div class="space-y-2 pt-1 bg-ink-50/70 p-3.5 rounded-2xl border border-ink-100">
          <div class="flex items-center gap-2">
            <input type="checkbox" id="s-show-to-students" checked class="w-4 h-4 rounded text-gold-500 border-ink-300">
            <label for="s-show-to-students" class="text-xs font-bold text-ink-900 cursor-pointer">
              Show to Students in Student Portal
            </label>
          </div>
          <p class="text-[11px] text-ink-500 pl-6">When checked, eligible students can see and explore this scheme from their student portal.</p>

          <div class="flex items-center gap-2 pt-1 border-t border-ink-200/50">
            <input type="checkbox" id="s-manual-review" class="w-4 h-4 rounded text-gold-500 border-ink-300">
            <label for="s-manual-review" class="text-xs font-semibold text-ink-800 cursor-pointer">
              Flag for Manual Review (Requires Officer Verification)
            </label>
          </div>

          <div class="flex items-center gap-2 pt-1 border-t border-ink-200/50">
            <input type="checkbox" id="s-active" checked class="w-4 h-4 rounded text-gold-500 border-ink-300">
            <label for="s-active" class="text-xs font-semibold text-ink-800 cursor-pointer">Active for enrollment</label>
          </div>
        </div>

        <div class="flex gap-3 pt-3 border-t border-ink-100">
          <button type="button" data-close-modal="scholarship-modal" class="flex-1 border border-ink-200 text-ink-700 text-xs font-semibold rounded-xl py-2.5 hover:bg-ink-50 transition">Cancel</button>
          <button type="submit" id="scholarship-save-btn" class="flex-1 bg-ink-900 hover:bg-ink-800 text-white text-xs font-bold rounded-xl py-2.5 shadow-xs transition">Save Scholarship</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Confirm delete modal -->
  <div id="confirm-modal" class="modal-root hidden fixed inset-0 z-50 flex items-center justify-center p-4">
    <div data-modal-backdrop class="absolute inset-0 bg-ink-950/60 backdrop-blur-xs"></div>
    <div data-sheet class="relative bg-white w-full max-w-sm rounded-3xl opacity-0 scale-95 p-6 shadow-2xl">
      <h3 id="confirm-title" class="font-display text-base font-bold text-ink-900 mb-1">Delete Scheme?</h3>
      <p id="confirm-message" class="text-xs text-ink-500 mb-5 leading-relaxed"></p>
      <div class="flex gap-3">
        <button id="confirm-no" class="flex-1 border border-ink-200 text-ink-700 text-xs font-semibold rounded-xl py-2.5 hover:bg-ink-50 transition">Cancel</button>
        <button id="confirm-yes" class="flex-1 bg-red-600 hover:bg-red-700 text-white text-xs font-bold rounded-xl py-2.5 shadow-xs transition">Delete</button>
      </div>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/constants.js"></script>
<script src="js/utils.js"></script>
<script src="js/auth.js"></script>
<script src="js/layout.js"></script>
<script src="js/toast.js"></script>
<script src="js/modal.js"></script>
<script src="js/scholarships.js"></script>
</body>
</html>
